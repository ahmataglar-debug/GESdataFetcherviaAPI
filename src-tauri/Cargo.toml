[package]
name = "comparison-app"
version = "0.1.0"
description = "Local-first iSolarCloud PV string monitoring and analysis"
authors = ["Comparison App"]
edition = "2021"

[lib]
name = "comparison_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
rusqlite = { version = "0.38", features = ["bundled", "chrono"] }
keyring = { version = "3", features = ["sync-secret-service"] }
url = "2"
open = "5"

[dev-dependencies]
tempfile = "3"

